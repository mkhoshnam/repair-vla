name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q rl faults scripts tests
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run joint-factorized tests
        run: python tests/test_joint_factorized.py
      - name: Run offline regression tests
        run: python tests/test_offline.py
